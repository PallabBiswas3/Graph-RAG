name: Phase 0 Build

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - upgrade/adaptive-evidence-agent-phase0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build client/server
        run: npm run build
