name: Phase 0-1 Validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - upgrade/adaptive-evidence-agent-phase0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client and server
        run: npm run build

      - name: Test retrieval metrics
        run: npm run test:metrics --workspace=server
